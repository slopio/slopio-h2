name: CI

on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # git's own ssh, so the URL rewrites below apply
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # runtime, slopio-tls and slopio-dns are private, one read-only deploy
      # key each, and GitHub stops at the first key it accepts: each repository
      # gets its own ssh host alias.
      - &deploy-keys
        name: Deploy keys
        env:
          RUNTIME_DEPLOY_KEY: ${{ secrets.RUNTIME_DEPLOY_KEY }}
          TLS_DEPLOY_KEY: ${{ secrets.TLS_DEPLOY_KEY }}
          DNS_DEPLOY_KEY: ${{ secrets.DNS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$RUNTIME_DEPLOY_KEY" > ~/.ssh/runtime
          printf '%s\n' "$TLS_DEPLOY_KEY" > ~/.ssh/tls
          printf '%s\n' "$DNS_DEPLOY_KEY" > ~/.ssh/dns
          chmod 600 ~/.ssh/runtime ~/.ssh/tls ~/.ssh/dns
          cat >> ~/.ssh/config <<'EOF'
          Host github-runtime
            HostName github.com
            User git
            IdentityFile ~/.ssh/runtime
            IdentitiesOnly yes
          Host github-tls
            HostName github.com
            User git
            IdentityFile ~/.ssh/tls
            IdentitiesOnly yes
          Host github-dns
            HostName github.com
            User git
            IdentityFile ~/.ssh/dns
            IdentitiesOnly yes
          EOF
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."ssh://github-runtime/saucisoupe/runtime.git".insteadOf ssh://git@github.com/saucisoupe/runtime.git
          git config --global url."ssh://github-tls/saucisoupe/slopio-tls.git".insteadOf ssh://git@github.com/saucisoupe/slopio-tls.git
          git config --global url."ssh://github-dns/slopio/slopio-dns.git".insteadOf ssh://git@github.com/slopio/slopio-dns.git
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings
      # The tls tests need kTLS; zero-copy sends and registered buffers pin
      # pages against RLIMIT_MEMLOCK.
      - name: Test
        run: |
          sudo modprobe tls
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo test --locked --all-features --no-fail-fast

  # The README's promise: h2spec passes clean, strict suite included.
  h2spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - *deploy-keys
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the server
        run: cargo build --locked --example server
      - name: Install h2spec
        run: |
          curl -sSfL -o h2spec.tgz https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          echo "157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318  h2spec.tgz" | sha256sum -c
          tar xzf h2spec.tgz h2spec
      - name: h2spec
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ./target/debug/examples/server &
          timeout 10 sh -c 'until nc -z 127.0.0.1 8080; do sleep 0.1; done'
          ./h2spec -h 127.0.0.1 -p 8080 --timeout 5
          ./h2spec -h 127.0.0.1 -p 8080 --timeout 5 --strict
