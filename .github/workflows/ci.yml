name: CI

on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings
      # The tls tests need kTLS; zero-copy sends and registered buffers pin
      # pages against RLIMIT_MEMLOCK.
      - name: Test
        run: |
          sudo modprobe tls
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo test --locked --all-features --no-fail-fast

  # The README's promise: h2spec passes clean, strict suite included.
  h2spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the server
        run: cargo build --locked --example server
      - name: Install h2spec
        run: |
          curl -sSfL -o h2spec.tgz https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          echo "157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318  h2spec.tgz" | sha256sum -c
          tar xzf h2spec.tgz h2spec
      - name: h2spec
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ./target/debug/examples/server &
          timeout 10 sh -c 'until nc -z 127.0.0.1 8080; do sleep 0.1; done'
          ./h2spec -h 127.0.0.1 -p 8080 --timeout 5
          ./h2spec -h 127.0.0.1 -p 8080 --timeout 5 --strict
