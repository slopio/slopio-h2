[package]
name = "popple-h2"
version = "0.1.0"
edition = "2024"

# `grpc` is everything under `src/grpc` and the few places a stream hands a
# body to it: requests with `content-type: application/grpc` are read as
# messages. Without it they are HTTP bodies like any other.
[features]
default = ["grpc"]
grpc = ["dep:prost"]

# The one example that needs the feature it demonstrates. Declaring a target
# does not turn off discovery of the others, which stay conventional.
[[example]]
name = "grpc_server"
path = "examples/grpc_server/main.rs"
required-features = ["grpc"]

[[example]]
name = "interop_server"
path = "examples/interop_server/main.rs"
required-features = ["grpc"]

[dependencies]
bytes = "1"
fnv = "1"
http = "1"
# What `application/grpc` means by default is `+proto`, so the feature that
# reads gRPC messages is also the one that decodes them. Without `derive` —
# that half is `prost-derive`, a proc macro, and it is the *caller* who derives
# `Message` on its own types. Here we only ever decode into someone else's.
prost = { version = "0.14", default-features = false, features = [
    "std",
], optional = true }
runtime = { git = "ssh://git@github.com/saucisoupe/runtime.git", version = "0.1.0" }
runtime-streams = { git = "ssh://git@github.com/saucisoupe/runtime.git" }
rustc-hash = "2.1.3"
zerocopy = { version = "0.8", features = ["derive"] }

# The simulated ring, for deterministic tests. A dev-dependency, so a release
# build carries no trace of it: with `simulation` off, the driver's backend
# enums have a single variant each and their dispatch compiles away.
#
# `runtime-core` is named directly because `runtime` does not re-export
# `deterministic_testing`; the feature is what `runtime/simulation` forwards.
[dev-dependencies]
libc = "0.2"
# With `derive` here: the tests are a caller, and a caller defines its own
# messages.
prost = { version = "0.14", features = ["derive"] }
runtime = { git = "ssh://git@github.com/saucisoupe/runtime.git", version = "0.1.0", features = [
    "simulation",
] }
runtime-core = { git = "ssh://git@github.com/saucisoupe/runtime.git", features = [
    "simulation",
] }
