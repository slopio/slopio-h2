[package]
name = "popple-h2"
version = "0.1.0"
edition = "2024"

[features]
default = ["grpc"]
grpc = ["dep:prost"]

# Off by default: rustls and aws-lc-rs are the largest thing this would compile.
tls = ["dep:popple-tls"]

[[example]]
name = "grpc_server"
path = "examples/grpc_server/main.rs"
required-features = ["grpc"]

[[example]]
name = "interop_server"
path = "examples/interop_server/main.rs"
required-features = ["grpc"]

[[example]]
name = "tls_client"
path = "examples/tls_client.rs"
required-features = ["tls"]

[[example]]
name = "helloworld_server"
path = "examples/helloworld_server.rs"
required-features = ["grpc"]

[[example]]
name = "grpc_load"
path = "examples/grpc_load.rs"
required-features = ["grpc"]

[dependencies]
bytes = "1"
fnv = "1"
http = "1"
# Without `derive`: the library only decodes into its callers' types.
prost = { version = "0.14", default-features = false, features = [
    "std",
], optional = true }
popple-dns = { git = "ssh://git@github.com/saucisoupe/popple-dns.git" }
popple-tls = { git = "ssh://git@github.com/saucisoupe/popple-tls.git", optional = true }
runtime = { git = "ssh://git@github.com/saucisoupe/runtime.git", version = "0.1.0" }
runtime-streams = { git = "ssh://git@github.com/saucisoupe/runtime.git" }
rustc-hash = "2.1.3"
zerocopy = { version = "0.8", features = ["derive"] }

# `simulation` stays a dev-dependency, so a release build carries no trace of it.
[dev-dependencies]
libc = "0.2"
rcgen = { version = "0.13", features = ["aws_lc_rs"] }
rustls = "0.23"
# A dev-dependency: which roots to trust is the application's choice.
webpki-roots = "1"

# With `derive` here: the tests are a caller, and define their own messages.
prost = { version = "0.14", features = ["derive"] }
runtime = { git = "ssh://git@github.com/saucisoupe/runtime.git", version = "0.1.0", features = [
    "simulation",
] }
# Named directly: `runtime` does not re-export `deterministic_testing`.
runtime-core = { git = "ssh://git@github.com/saucisoupe/runtime.git", features = [
    "simulation",
] }
