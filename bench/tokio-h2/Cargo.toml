[package]
name = "tokio-h2-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
h2 = "0.4"
http = "1"
tokio = { version = "1", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }

# popple-h2 gets mimalloc whether it asks for it or not — `runtime` installs it
# as the global allocator. Comparing its memory against a glibc-malloc tokio
# measures the two allocators as much as the two servers, so this side can be
# built with the same one.
mimalloc = { version = "0.1.48", features = [
    "local_dynamic_tls",
    "v3",
], optional = true }

[features]
mimalloc-global = ["dep:mimalloc"]

# No `[profile.release]`: popple-h2 has none either, so both sides are built by
# the same default release profile rather than one of them getting an optimizer
# the other does not.
